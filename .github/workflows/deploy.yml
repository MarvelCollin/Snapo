name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET: ${{ github.ref_name == 'main' && '.' || github.ref_name }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore dependencies
        id: modules
        uses: actions/cache@v6
        with:
          path: node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/${{ github.ref_name != 'main' && format('{0}/', github.ref_name) || '' }}

      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf "$RUNNER_TEMP/pages"
            if git clone -q --depth 1 --branch gh-pages "$remote" "$RUNNER_TEMP/pages" 2>/dev/null; then
              lease=$(git -C "$RUNNER_TEMP/pages" rev-parse HEAD)
            else
              git init -q -b gh-pages "$RUNNER_TEMP/pages"
              git -C "$RUNNER_TEMP/pages" remote add origin "$remote"
              lease=""
            fi
            cd "$RUNNER_TEMP/pages"
            if [ "$TARGET" = "." ]; then
              find . -mindepth 1 -maxdepth 1 ! -name .git ! -name dev -exec rm -rf {} +
            else
              rm -rf "$TARGET"
              mkdir -p "$TARGET"
            fi
            cp -r "$GITHUB_WORKSPACE/dist/." "$TARGET/"
            if [ "$TARGET" != "." ]; then rm -f "$TARGET/404.html"; fi
            if [ ! -f 404.html ]; then cp "$GITHUB_WORKSPACE/dist/404.html" 404.html; fi
            touch .nojekyll
            git checkout -q --orphan publish
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "feat: publish ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}"
            if git push -q --force-with-lease="gh-pages:${lease}" origin publish:gh-pages; then
              du -sh --exclude=.git .
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 3))
          done
          exit 1
