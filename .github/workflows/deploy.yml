name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Check out dev
        uses: actions/checkout@v7
        with:
          ref: dev
          path: dev

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore main dependencies
        id: main-modules
        uses: actions/cache@v6
        with:
          path: main/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('main/package-lock.json') }}

      - name: Restore dev dependencies
        id: dev-modules
        uses: actions/cache@v6
        with:
          path: dev/node_modules
          key: modules-${{ runner.os }}-node22-${{ hashFiles('dev/package-lock.json') }}

      - name: Install main dependencies
        if: steps.main-modules.outputs.cache-hit != 'true'
        working-directory: main
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Install dev dependencies
        if: steps.dev-modules.outputs.cache-hit != 'true'
        working-directory: dev
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Build main
        working-directory: main
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - name: Build dev
        working-directory: dev
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev/

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main/dist/. site/
          mkdir -p site/dev
          cp -r dev/dist/. site/dev/
          if [ ! -f site/404.html ]; then cp dev/dist/404.html site/404.html; fi
          rm -f site/dev/404.html
          touch site/.nojekyll
          du -sh site

      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Publish
        id: deployment
        uses: actions/github-script@v9
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const { owner, repo } = context.repo
            const version = `${context.sha}-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`
            const { data } = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner,
              repo,
              artifact_id: Number(process.env.ARTIFACT_ID),
              pages_build_version: version,
              oidc_token: await core.getIDToken(),
            })
            core.setOutput('page_url', data.page_url)
            const id = data.id ?? data.status_url.split('/').pop()
            const done = ['succeed']
            const failed = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_perms_error', 'deployment_attempt_error']
            for (let i = 0; i < 120; i++) {
              const { data: state } = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id })
              core.info(`${version}: ${state.status}`)
              if (done.includes(state.status)) return
              if (failed.includes(state.status)) throw new Error(`Pages deployment ${state.status}`)
              await new Promise((resolve) => setTimeout(resolve, 3000))
            }
            throw new Error('Pages deployment timed out')
